<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Wishlist Analyzer</title>
<meta name="theme-color" content="#0b1522">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Wishlist">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>:root{color-scheme:light;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: Seitenleiste links (Navigation + Regler, immer sichtbar), rechts eine Inhaltsspalte.
   Schmal: feste Kopfzeile mit Tabs, Regler als Schublade von unten. Dark-first, Fahrplantafel als Leitmotiv. */
:root{
  --bg:#0b121a; --s1:#121c28; --s2:#192636; --line:#253549; --fg:#e6edf5; --mu:#8fa4b9;
  --ac:#2ea8ff; --acink:#04121f; --good:#52c47d; --warn:#f2b544; --bad:#f47272;
  --board:#05080c; --boardfg:#ffc94a; --boardmu:#a58a3c;
  --f-d:"Barlow Condensed","Arial Narrow",sans-serif;
  --f-b:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-m:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){
  :root:not([data-theme="dark"]){
    --bg:#edf1f6; --s1:#ffffff; --s2:#f1f5f9; --line:#d3dce7; --fg:#0f1a26; --mu:#546a80;
    --ac:#0a78cc; --acink:#ffffff; --good:#1c8a4b; --warn:#9a6200; --bad:#c13a3a;
    --board:#10161d; --boardfg:#ffc94a; --boardmu:#b59a4a; color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#edf1f6; --s1:#ffffff; --s2:#f1f5f9; --line:#d3dce7; --fg:#0f1a26; --mu:#546a80;
  --ac:#0a78cc; --acink:#ffffff; --good:#1c8a4b; --warn:#9a6200; --bad:#c13a3a;
  --board:#10161d; --boardfg:#ffc94a; --boardmu:#b59a4a; color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:14px/1.5 var(--f-b);margin:0;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--f-d);font-weight:600;letter-spacing:.01em;margin:0;text-wrap:balance}
h1{font-size:2rem;line-height:1.1}
h2{font-size:1.35rem;line-height:1.15}
h3{font-size:1.05rem}
p{margin:0}
a{color:var(--ac)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.num{font-family:var(--f-m);font-variant-numeric:tabular-nums}
.mu{color:var(--mu)}
.sm{font-size:.82rem}

.app{display:grid;grid-template-columns:minmax(0,1fr);min-height:100%}
.side{background:var(--s1);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.brand{display:flex;align-items:baseline;gap:.6rem;padding:10px 16px 4px}
.brand b{font-family:var(--f-d);font-size:1.35rem;font-weight:700;letter-spacing:.02em}
.brand span{font-family:var(--f-m);font-size:.7rem;color:var(--mu)}
#nav{display:flex;gap:4px;overflow-x:auto;padding:4px 12px 10px;scrollbar-width:none}
#nav::-webkit-scrollbar{display:none}
#nav button{flex:none;display:flex;align-items:center;gap:.45rem;background:none;border:1px solid transparent;color:var(--mu);padding:7px 12px;border-radius:8px;cursor:pointer;white-space:nowrap}
#nav button:hover{color:var(--fg)}
#nav button[aria-current="page"]{background:var(--s2);color:var(--fg);border-color:var(--line);box-shadow:inset 3px 0 0 var(--ac)}
#nav .cnt{font-family:var(--f-m);font-size:.72rem;color:var(--mu)}
.wp{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--s1);border-top:1px solid var(--line);border-radius:14px 14px 0 0;padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));max-height:78%;overflow:auto;transform:translateY(105%);transition:transform .22s ease;box-shadow:0 -12px 40px #0008}
.wp.open{transform:none}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ac);color:var(--acink);border:0;border-radius:99px;padding:10px 18px;font-weight:600;cursor:pointer;box-shadow:0 6px 24px #0007}
main{min-width:0;padding:16px 16px 96px}
.mhead{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;justify-content:space-between;margin-bottom:16px}
.mhead .stand{font-family:var(--f-m);font-size:.74rem;color:var(--mu)}
@media (min-width:960px){
  .app{grid-template-columns:292px minmax(0,1fr)}
  .side{position:sticky;top:0;height:100vh;height:100dvh;overflow:auto;border-bottom:0;border-right:1px solid var(--line);display:flex;flex-direction:column}
  .brand{padding:18px 18px 10px}
  #nav{flex-direction:column;overflow:visible;padding:4px 10px 12px}
  #nav button{justify-content:space-between}
  .wp{position:static;transform:none;max-height:none;border:0;border-top:1px solid var(--line);border-radius:0;box-shadow:none;padding:16px 18px 24px;overflow:visible}
  .fab,.wp .x{display:none}
  main{padding:24px 28px 56px;max-width:1180px;width:100%}
}

.card{background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0}
.card.flat{background:var(--s2)}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,19rem),1fr))}
.grid.kpi{grid-template-columns:repeat(auto-fit,minmax(min(100%,10.5rem),1fr))}
.grid.sm3{grid-template-columns:repeat(auto-fill,minmax(min(100%,13rem),1fr))}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.row.sp{justify-content:space-between}
.sec{display:flex;flex-direction:column;gap:10px;margin-top:26px}
.sec>h2{display:flex;align-items:baseline;gap:.6rem}
.sec>h2 small{font:400 .75rem var(--f-m);color:var(--mu)}
.btn{background:var(--ac);color:var(--acink);border:0;border-radius:8px;padding:7px 12px;font-weight:600;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:.4rem;line-height:1.2}
.btn:hover{filter:brightness(1.1)}
.btn.g{background:var(--s2);color:var(--fg);border:1px solid var(--line);font-weight:500}
.btn.g:hover{border-color:var(--mu)}
.btn.on{background:var(--ac);color:var(--acink);border-color:var(--ac)}
.btn.sm{padding:4px 9px;font-size:.8rem}
.pill{display:inline-flex;align-items:center;gap:.3rem;padding:1px 9px;border-radius:99px;font-size:.74rem;font-family:var(--f-m);background:var(--s2);border:1px solid var(--line);color:var(--mu);white-space:nowrap}
.pill.good{color:var(--good);border-color:var(--good)}
.pill.warn{color:var(--warn);border-color:var(--warn)}
.pill.bad{color:var(--bad);border-color:var(--bad)}
.pill.ac{color:var(--ac);border-color:var(--ac)}
input[type=text],input[type=number],input[type=search],select,textarea{background:var(--s2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;min-width:0;max-width:100%}
input[type=range]{accent-color:var(--ac);width:100%;min-width:0}
input[type=checkbox]{accent-color:var(--ac);width:17px;height:17px}
textarea{width:100%;resize:vertical}

/* Fahrplantafel */
.board{background:var(--board);color:var(--boardfg);border-radius:12px;padding:12px 16px;font-family:var(--f-m);border:1px solid #000}
.board .bh{display:flex;justify-content:space-between;gap:10px;font-size:.7rem;letter-spacing:.14em;color:var(--boardmu);padding-bottom:8px;border-bottom:1px solid #ffffff1a;text-transform:uppercase}
.board .br{display:grid;grid-template-columns:5.2rem minmax(0,1fr) auto;gap:4px 14px;padding:8px 0;border-bottom:1px solid #ffffff10;align-items:baseline}
.board .br:last-child{border-bottom:0;padding-bottom:0}
.board .br b{font-weight:500;font-size:1.05rem}
.board .br .n{overflow-wrap:anywhere}
.board .br.dim{color:var(--boardmu)}
.board .br .d{text-align:right;white-space:nowrap}
@media (max-width:520px){.board .br{grid-template-columns:4.4rem minmax(0,1fr)}.board .br .d{grid-column:2;text-align:left}}

/* Regler */
.wp h3{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.wp .x{background:none;border:0;color:var(--mu);font-size:1.3rem;cursor:pointer;line-height:1}
.sl{display:grid;grid-template-columns:minmax(0,1fr) 2.6rem;gap:0 8px;align-items:center;margin:7px 0}
.sl label{grid-column:1/-1;font-size:.82rem;color:var(--mu);display:flex;justify-content:space-between;gap:8px}
.sl .v{font-family:var(--f-m);font-size:.8rem;text-align:right}
.wp .best{margin-top:14px;display:flex;flex-direction:column;gap:6px}
.wp .best .it{display:flex;justify-content:space-between;gap:8px;align-items:baseline;padding:6px 8px;border-radius:8px;background:var(--s2);cursor:pointer;border:0;text-align:left;width:100%}
.wp .best .it:hover{outline:1px solid var(--ac)}
.wp .best .it span:first-child{min-width:0;overflow-wrap:anywhere}
.lbl{font-family:var(--f-m);font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--mu)}

/* Karten */
.gc{display:flex;flex-direction:column;gap:10px}
.gc .top{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:10px;align-items:start}
.tile{width:52px;height:52px;border-radius:10px;display:grid;place-items:center;color:#fff;font:700 1.15rem var(--f-d);letter-spacing:.03em}
.gc .ti{font-weight:600;line-height:1.25;overflow-wrap:anywhere}
.price{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.price .now{font:500 1.2rem var(--f-m)}
.price s{color:var(--mu);font:.85rem var(--f-m)}
.ring{--s:0;width:52px;height:52px;border-radius:50%;background:conic-gradient(var(--ac) calc(var(--s)*1%),var(--line) 0);display:grid;place-items:center;flex:none}
.ring i{font:600 1.05rem var(--f-d);font-style:normal;width:40px;height:40px;border-radius:50%;background:var(--s1);display:grid;place-items:center}
.ring.lg{width:92px;height:92px}.ring.lg i{width:74px;height:74px;font-size:2rem}
.ring.na{background:var(--line)}
.ring.na i{color:var(--mu)}

/* Tabellen */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--s1)}
table{border-collapse:collapse;width:100%}
th,td{padding:8px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font:500 .7rem var(--f-m);letter-spacing:.1em;text-transform:uppercase;color:var(--mu);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.win{background:color-mix(in srgb,var(--good) 16%,transparent);font-weight:600}
td.nw{white-space:nowrap}

/* Katalog */
.cat{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--s1)}
.cr{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px 12px;align-items:center;padding:9px 14px;border-bottom:1px solid var(--line)}
.cr:last-child{border-bottom:0}
.cr.owned .tt{color:var(--mu);text-decoration:line-through}
.cr .tt{overflow-wrap:anywhere;cursor:pointer;background:none;border:0;text-align:left;padding:0;font-weight:500}
.cr .tt:hover{color:var(--ac)}
.cr .pr{text-align:right;white-space:nowrap}
.cr .ac2{grid-column:2/-1;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
@media (min-width:760px){.cr{grid-template-columns:auto minmax(0,1fr) 11rem auto}.cr .ac2{grid-column:auto}}

/* Analyse */
.crit{display:grid;grid-template-columns:minmax(0,1fr);gap:2px 12px;padding:10px 0;border-bottom:1px solid var(--line)}
.crit:last-child{border-bottom:0}
.crit .h{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.crit .ctl{display:grid;grid-template-columns:minmax(0,1fr) 3.4rem auto;gap:8px;align-items:center}
.ev{white-space:pre-wrap;overflow-wrap:anywhere}
.chartbox{width:100%;overflow:hidden}
.chartbox svg{width:100%;height:auto;display:block}
.chartbox .ax{stroke:var(--line);stroke-width:1}
.chartbox .gl{stroke:var(--line);stroke-width:1;stroke-dasharray:2 4}
.chartbox text{fill:var(--mu);font:11px var(--f-m)}
.chartbox .bandS{fill:color-mix(in srgb,var(--ac) 18%,transparent)}
.chartbox .bandF{fill:color-mix(in srgb,var(--mu) 12%,transparent)}
.chartbox .bandN{fill:color-mix(in srgb,var(--warn) 20%,transparent)}
.chartbox text.halo{fill:var(--fg);paint-order:stroke;stroke:var(--s1);stroke-width:4px;stroke-linejoin:round;font-size:12px}
.chartbox .ln{fill:none;stroke:var(--ac);stroke-width:2.5}
.chartbox .ln.d{stroke-dasharray:5 5;stroke:var(--mu);stroke-width:2}
.chartbox .pt{fill:var(--ac);stroke:var(--bg);stroke-width:2}
.chartbox .pt.h{fill:var(--bg);stroke:var(--mu);stroke-width:2}
.chartbox .tg{stroke:var(--good);stroke-width:1.5;stroke-dasharray:6 4}
.chartbox .today{stroke:var(--warn);stroke-width:1.5}
.chartbox .pe{stroke:var(--bad);stroke-width:1.5;stroke-dasharray:2 3}
.chartbox text.t-w{fill:var(--warn)}.chartbox text.t-g{fill:var(--good)}.chartbox text.t-b{fill:var(--bad)}.chartbox text.t-a{fill:var(--ac)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.78rem;color:var(--mu)}
.legend i{display:inline-block;width:14px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}

/* Sheet */
.shade{position:fixed;inset:0;background:#000b;z-index:60;display:flex;justify-content:center;align-items:flex-start;overflow:auto;padding:max(16px,env(safe-area-inset-top,0px)) 16px 24px}
.shade[hidden]{display:none}
.sheet{background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:18px;width:100%;max-width:680px;margin-block:auto}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--s2);border:1px solid var(--line);padding:8px 14px;border-radius:99px;z-index:70;font-size:.85rem;max-width:90%}
.toast[hidden]{display:none}
@media (min-width:960px){.toast{bottom:24px}}
/* Lokale App */
.jobbar{position:fixed;right:16px;top:calc(12px + env(safe-area-inset-top,0px));z-index:65;background:var(--s2);border:1px solid var(--line);border-radius:12px;padding:10px 14px;max-width:min(92vw,22rem);box-shadow:0 8px 30px #0006}
.jobbar[hidden]{display:none}
.jobbar .bar{height:6px;background:var(--line);border-radius:9px;overflow:hidden;margin-top:6px}
.jobbar .bar i{display:block;height:100%;background:var(--ac);transition:width .3s}
.bar{height:8px;background:var(--line);border-radius:9px;overflow:hidden;align-self:center}
.bar i{display:block;height:100%;background:var(--ac)}
.chat{display:flex;flex-direction:column;gap:12px}
.msg{display:flex;flex-direction:column;gap:4px;max-width:100%;min-width:0}
.msg.me{align-self:flex-end;background:var(--s2);border:1px solid var(--line);border-radius:12px 12px 2px 12px;padding:8px 12px;max-width:min(100%,34rem)}
.msg.bot{background:var(--s1);border:1px solid var(--line);border-radius:12px 12px 12px 2px;padding:10px 14px}
code{font-family:var(--f-m);font-size:.85em;background:var(--s2);padding:1px 5px;border-radius:5px}
summary{cursor:pointer}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ===== Design v6: mobil zuerst ===== */
:root{
  --bg:#070c14; --s1:#0e1623; --s2:#152033; --s3:#1c2a40; --line:#21304a; --fg:#ebf2fb; --mu:#8da2bb;
  --ac:#38a2ff; --ac2:#7b8cff; --acink:#021021; --good:#4fd18b; --warn:#f6bb4d; --bad:#ff7b7b;
  --board:#04070b; --boardfg:#ffc94a; --boardmu:#a58a3c; --r:18px;
  --f-d:"Sora","Inter",system-ui,sans-serif; --f-b:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --glow:radial-gradient(120% 80% at 0% 0%,#1b3a63 0%,transparent 55%);
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#eef2f8; --s1:#ffffff; --s2:#f2f6fb; --s3:#e6edf6; --line:#d5deea; --fg:#0e1a29; --mu:#566b82;
  --ac:#0a74d0; --ac2:#4f5fe0; --acink:#ffffff; --good:#17824a; --warn:#946000; --bad:#c23a3a;
  --glow:radial-gradient(120% 80% at 0% 0%,#d6e8fb 0%,transparent 55%);
}}
:root[data-theme="light"]{
  --bg:#eef2f8; --s1:#ffffff; --s2:#f2f6fb; --s3:#e6edf6; --line:#d5deea; --fg:#0e1a29; --mu:#566b82;
  --ac:#0a74d0; --ac2:#4f5fe0; --acink:#ffffff; --good:#17824a; --warn:#946000; --bad:#c23a3a;
  --glow:radial-gradient(120% 80% at 0% 0%,#d6e8fb 0%,transparent 55%);
}
body{font-size:15px;line-height:1.55;background:var(--bg) var(--glow) no-repeat;background-attachment:fixed}
h1{font-size:1.8rem;font-weight:700;letter-spacing:-.025em;line-height:1.12}
h2{font-size:1.2rem;font-weight:650;letter-spacing:-.015em}
h3{font-size:1.05rem;font-weight:650;letter-spacing:-.01em}
.side{background:color-mix(in srgb,var(--bg) 94%,var(--s1));border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;padding:10px 16px}
.brand b{font-family:var(--f-d);font-size:1.02rem;font-weight:650;letter-spacing:-.01em}
.brand span{font-size:.68rem;padding:1px 8px;border-radius:99px;background:var(--s3);color:var(--mu);font-family:var(--f-m)}
.brand .ib{margin-left:auto;min-width:42px;padding:0;justify-content:center;font-size:1.15rem}
#nav{display:none}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:35;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:color-mix(in srgb,var(--s1) 88%,transparent);-webkit-backdrop-filter:blur(18px) saturate(150%);backdrop-filter:blur(18px) saturate(150%);border-top:1px solid var(--line);padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px))}
.tabbar button{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:54px;background:none;border:0;color:var(--mu);font-size:.68rem;font-weight:500;cursor:pointer;border-radius:14px;padding:4px 2px}
.tabbar button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabbar button[aria-current="page"]{color:var(--ac)}
.tabbar button[aria-current="page"]::before{content:"";position:absolute;top:2px;width:30px;height:3px;border-radius:3px;background:var(--ac)}
.tabbar .bd{position:absolute;top:4px;left:calc(50% + 8px);min-width:17px;height:17px;padding:0 4px;border-radius:99px;background:var(--ac);color:var(--acink);font-size:.62rem;font-weight:700;display:grid;place-items:center}
.fab{bottom:calc(74px + env(safe-area-inset-bottom,0px));background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;padding:11px 18px;box-shadow:0 8px 28px #0008}
main{padding:14px 16px calc(100px + env(safe-area-inset-bottom,0px))}
.mhead{margin-bottom:14px;gap:6px 14px}
.mhead .row .btn[data-act="refresh"]{display:none}
.mhead .stand{background:var(--s2);border:1px solid var(--line);padding:3px 10px;border-radius:99px;font-size:.7rem}
.card{background:linear-gradient(180deg,color-mix(in srgb,var(--s1) 96%,#fff 4%),var(--s1));border-radius:var(--r);padding:16px;box-shadow:0 1px 0 #ffffff08 inset,0 6px 20px #0003}
.card.flat{background:var(--s2);box-shadow:none}
.sec{margin-top:24px}
.btn{min-height:42px;border-radius:13px;padding:9px 15px;background:linear-gradient(135deg,var(--ac),color-mix(in srgb,var(--ac) 70%,var(--ac2)));color:var(--acink);font-weight:600;justify-content:center}
.btn.g{background:var(--s2);color:var(--fg);border:1px solid var(--line)}
.btn.sm{min-height:36px;padding:6px 12px;font-size:.84rem;border-radius:11px}
.pill{padding:2px 10px;font-size:.72rem}

/* ---------- Preis-Diagramm ---------- */
function niceMax(v){const st=v>40?10:v>20?5:v>8?2:1;return Math.ceil(v/st)*st}
function chart(g){
  const W=Math.max(300,Math.min(720,Math.round(($('#main').clientWidth||788)-66))),H=W<500?300:320,L=48,Rr=16,T=22,B=38,h=hist(g);
  const t0=Math.min(Date.parse(h[0].d+'T00:00:00'),Date.parse('2026-08-20T00:00:00')),t1=Date.parse('2027-03-31T00:00:00');
  const x=t=>L+(clamp(t,t0,t1)-t0)/(t1-t0)*(W-L-Rr);
  const tg=(S.u[g.id]||{}).target;
  const ymax=niceMax(Math.max(...h.map(p=>Math.max(p.o||0,p.p||0)),tg||0,1)*1.08);
  const y=v=>T+(1-v/ymax)*(H-T-B);
  let o=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Preisverlauf von ${esc(g.t)} mit Sale-Zeiträumen">`;
  const bt=Math.round(ymax/4);
  for(let i=0;i<=4;i++){const v=i*bt;o+=`<line class="gl" x1="${L}" x2="${W-Rr}" y1="${y(v)}" y2="${y(v)}"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end">${v} €</text>`}
  EVENTS.forEach(e=>{const a=Date.parse(e.a+'T00:00:00'),b=Date.parse(e.b+'T00:00:00');if(b<t0||a>t1)return;const xa=x(a),xb=Math.max(x(b),xa+3);const next=nextSale()===e;
    o+=`<rect class="${e.k==='sale'?(next?'bandN':'bandS'):'bandF'}" x="${xa}" y="${T}" width="${xb-xa}" height="${H-T-B}"/>`;
    if(e.k==='sale'){const late=xa>W-130;o+=`<text x="${late?xb:xa+3}" y="${T+11}" text-anchor="${late?'end':'start'}" class="${next?'t-w':'t-a'}">${esc(W<500&&e.s?e.s:e.n.replace('Steam ',''))}</text>`}});
  const days=(t1-t0)/864e5,stepM=days>330?3:W<500?2:1;let d0=new Date(t0);d0=new Date(d0.getFullYear(),d0.getMonth()+(d0.getDate()>1?1:0),1);
  for(let d=d0,i=0;d.getTime()<=t1;d=new Date(d.getFullYear(),d.getMonth()+1,1),i++){if(i%stepM)continue;const xx=x(d.getTime());o+=`<line class="ax" x1="${xx}" x2="${xx}" y1="${H-B}" y2="${H-B+5}"/><text x="${xx}" y="${H-B+18}" text-anchor="middle">${MON[d.getMonth()]}${d.getMonth()===0?' '+d.getFullYear():''}</text>`}
  o+=`<line class="ax" x1="${L}" x2="${W-Rr}" y1="${H-B}" y2="${H-B}"/>`;
  const tdy=Date.parse(todayISO()+'T00:00:00');

  if(L.length<2)return head('Vergleich','Wähle mindestens zwei Einträge.')+pick+`<div class="card mu">${L.length?esc(shortT(L[0]))+' ist gewählt. ':''}Wähle einen weiteren Eintrag oder drücke „Beste drei wählen“.</div>`;
  const rows=[['Score',g=>score(g).s,1],['Konfidenz %',g=>Math.round(score(g).conf*100),1],['Preis €',g=>price(g),-1],['Rabatt %',g=>disc(g),1],['Ersparnis €',g=>+(orig(g)-price(g)).toFixed(2),1],...CR.map(c=>[c[1],g=>rating(g,c[0]),1]),['Landschaft',g=>scenic(g),1]];
  const body=rows.map(([n,fn,d])=>{const v=L.map(fn),ok=v.filter(x=>x!=null),b=ok.length>1&&new Set(ok).size>1?(d>0?Math.max(...ok):Math.min(...ok)):null;return `<tr><td class="nw"><b>${n}</b></td>${v.map(x=>`<td class="num${x!=null&&x===b?' win':''}">${x??'unbekannt'}</td>`).join('')}</tr>`}).join('');
  const a=L[0],b=L[1];
  return head('Vergleich')+pick+`<div class="tw"><table><tr><th></th>${L.map(g=>`<th style="white-space:normal;min-width:9rem">${esc(g.t)}<br><button type="button" class="btn g sm" data-act="cmp" data-id="${g.id}">entfernen</button></th>`).join('')}</tr>${body}</table></div>
  <p class="mu sm" style="margin-top:8px">Grün = beste Spalte der Zeile. „Unbekannt“ wird nicht abgewertet.</p>
  <div class="sec"><h2>Was gewinne und verliere ich?</h2><div class="card stack">${gainLose(a,b)}<div class="row"><button type="button" class="btn g sm" data-act="cmpswap">Reihenfolge tauschen</button></div></div></div>`;
}
function gainLose(a,b){
  const sa=score(a).s,sb=score(b).s,pd=price(a)-price(b);
  let li=[];
  if(sa!=null&&sb!=null)li.push(`Score: ${sa} gegen ${sb} (${sa-sb>0?'+':''}${sa-sb}).`);else li.push('Mindestens einer der beiden ist nicht bewertet, ein Score-Vergleich ist nicht möglich.');
  li.push(`Preis: ${eur(price(a))} gegen ${eur(price(b))} (${pd>0?'+':''}${eur(pd).replace(' €','')} €).`);
  CR.forEach(c=>{const x=rating(a,c[0]),y=rating(b,c[0]);if(x!=null&&y!=null&&x!==y)li.push(`${c[1]}: ${x>y?'Gewinn':'Verlust'} (${x} gegen ${y}).`)});
  if(a.ty!==b.ty)li.push('Unterschiedlicher Typ (Strecke gegen Fahrzeug): kaum überlappender Inhalt.');
  if(sa!=null&&sb!=null&&sa<sb&&price(a)<price(b))li.push(`${a.t} ist trotz niedrigerem Score günstiger und kann bei knappem Budget die bessere Wahl sein.`);
  return `<p><b>${esc(a.t)}</b> statt <b>${esc(b.t)}</b>:</p><ul style="margin:0;padding-left:1.2rem">${li.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`;
}

const norm=s=>s.toLowerCase().replace(/[®™]/g,'').replace(/&amp;/g,'&').replace(/[–—]/g,'-').replace(/ /g,' ').replace(/\s+/g,' ').trim();
const num=s=>parseFloat(s.replace(/\./g,'').replace(',','.'));
function parsePaste(txt,opt){
  const T=norm(txt),rep={upd:[],same:[],bad:[],neu:[],miss:0};
  const idx=[];
  G.forEach(g=>{const key=norm(g.pre==='TSW7'?'train sim world 7: '+g.t:g.pre==='TSW6'?'train sim world 6: '+g.t:g.t);const p=T.indexOf(key);if(p>=0)idx.push({g,p,len:key.length})});
  // neue Titel anhand "Release Date"-Zeilen erkennen
  const re=/(train sim world[^\n]{5,160}?)\s*(?:release date|erscheinungsdatum)/g;let m;const known=new Set(idx.map(x=>x.p));
  const raw=txt.replace(/[®™]/g,'').replace(/ /g,' ');
  const re2=/(Train Sim World\s*\d?:[^\n]{5,160})\n+\s*(?:Release Date|Erscheinungsdatum)/g;
  const newOnes=[];while((m=re2.exec(raw))){const t=m[1].trim();const key=norm(t);if(!idx.find(x=>key.includes(norm(x.g.t))||norm(x.g.t).includes(key.replace(/^train sim world \d?: /,'')))&&!newOnes.includes(t))newOnes.push(t)}
  newOnes.forEach(t=>{const p=T.indexOf(norm(t));if(p>=0){const g={id:-(Date.now()%900000+idx.length),t:t.replace(/^Train Sim World\s*\d?:\s*/,''),pre:'TSW7',d:'',ty:/Route Add-On|Bahnstrecke|Corridor|Line:/i.test(t)&&!/Loco|EMU|DMU|Pack/i.test(t)?'route':'other',rev:'',flag:'',base:[],wish0:true,__new:true};idx.push({g,p,len:norm(t).length})}});
  idx.sort((a,b)=>a.p-b.p);
  const today=todayISO();
  idx.forEach((x,i)=>{
    const seg=T.slice(x.p+x.len,Math.min(i+1<idx.length?idx[i+1].p:T.length,x.p+x.len+420));
    if(/\$\s?\d/.test(seg)&&!/€|eur/.test(seg)){rep.bad.push(x.g.t+' (USD, übersprungen)');return}
    const am=[...seg.matchAll(/(\d{1,3}(?:\.\d{3})*,\d{2})\s?(?:€|eur)|(?:€|eur)\s?(\d{1,3}(?:\.\d{3})*,\d{2})/g)].map(a=>num(a[1]||a[2]));
    const dm=seg.match(/-\s?(\d{1,2})\s?%/),dp=dm?+dm[1]:0;
    let p,o;
    if(!am.length){if(/free|kostenlos/.test(seg)){p=o=0}else{rep.bad.push(x.g.t+' (kein Preis gefunden)');return}}
    else if(dp){if(am.length<2){rep.bad.push(x.g.t+' (Rabatt ohne Normalpreis)');return}o=am[0];p=am[1];if(Math.abs(Math.round((1-p/o)*100)-dp)>1){rep.bad.push(x.g.t+' (Rabatt passt nicht zu den Preisen)');return}}
    else{p=o=am[0]}
    let g=x.g;
    if(g.__new){delete g.__new;S.extra.push({id:g.id,t:g.t,pre:g.pre,d:'',ty:g.ty,rev:'',wish:1,h:[]});buildModel();g=BY.get(g.id);rep.neu.push(g.t)}
    const c=curPt(g),changed=c.p==null||Math.abs(c.p-p)>.004||Math.abs((c.o||0)-o)>.004;
    const u=U(g.id);u.hist=(u.hist||[]).filter(e=>!(e.d===today&&e.k==='obs'));
    u.hist.push({d:today,p,o,k:'obs',src:'eingefügt'});
    if(opt.wish)u.wish=true;
    (changed?rep.upd:rep.same).push(g.t+(changed?`: ${eur(c.p)} → ${eur(p)}`:''));
  });
  if(opt.prune){const f=new Set(idx.map(x=>x.g.id));G.filter(isWish).forEach(g=>{if(!f.has(g.id)){U(g.id).wish=false;rep.miss++}})}
  S.refreshed=new Date().toLocaleString('de-DE',{dateStyle:'short',timeStyle:'short'});save();return rep;
}

function applyObs(g,p,o,src,date,rep){
  const c=curPt(g),changed=c.p==null||Math.abs(c.p-p)>.004||Math.abs((c.o||0)-o)>.004;
  const u=U(g.id);u.hist=(u.hist||[]).filter(e=>!(e.d===date&&e.k==='obs'));
  u.hist.push({d:date,p,o,k:'obs',src});

}
function parseJson(j,opt){
  const rep={upd:[],same:[],bad:[],neu:[],miss:0};
  if(!j||j.swa!==1||!j.preise||typeof j.preise!=='object')throw new Error('Das ist keine Datei des Update-Skripts.');
  const today=todayISO(),date=/^\d{4}-\d{2}-\d{2}$/.test(j.stand||'')&&j.stand<=today?j.stand:today;
  (j.neu||[]).forEach(n=>{const id=+n.id;if(id>0&&n.t&&!BY.has(id)){const t=String(n.t);S.extra.push({id,t,pre:String(n.pre||'Steam'),d:'',ty:/Route Add-On|Bahnstrecke|Corridor|Line:/i.test(t)&&!/Loco|EMU|DMU|Pack/i.test(t)?'route':'other',rev:'',wish:1,h:[]});rep.neu.push(t)}});
  if(rep.neu.length)buildModel();
  Object.keys(j.preise).forEach(k=>{const g=BY.get(+k),e=j.preise[k]||{};if(!g)return;const p=+e.p,o=+e.o;if(!(p>=0)||!(o>=p-.004)){rep.bad.push(g.t+' (Preise unplausibel)');return}applyObs(g,p,o,'API',date,rep)});
  if(Array.isArray(j.wunschliste)&&j.wunschliste.length){
    const ws=new Set(j.wunschliste.map(Number));
    G.forEach(g=>{const w=ws.has(g.id);if(!w&&isWish(g))rep.miss++;U(g.id).wish=w});
  }
  S.refreshed=new Date().toLocaleString('de-DE',{dateStyle:'short',timeStyle:'short'});save();return rep;
}
const UPDATE_SCRIPT=String.raw`// Steam Wishlist Analyzer: Preise und Wunschliste abrufen (Node.js 18 oder neuer)

import { writeFileSync } from "node:fs";
const KEY = process.env.STEAM_API_KEY || "";

const CC = "de";
const IDS = [__IDS__];
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
async function getJson(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error("HTTP " + r.status + " bei " + url.split("?")[0]);
  return r.json();
}
async function wishlist() {
  let url = "https://api.steampowered.com/IWishlistService/GetWishlist/v1/?steamid=" + STEAMID;
  if (KEY) url += "&key=" + encodeURIComponent(KEY);
  const j = await getJson(url);
  const items = (j.response && j.response.items) || [];
  if (!items.length) console.warn("Wunschliste leer oder unerwartetes Format: " + JSON.stringify(j).slice(0, 200));
  return items.map((x) => x.appid);
}
function details(ids, filters) {
  return getJson("https://store.steampowered.com/api/appdetails?appids=" + ids.join(",") + "&cc=" + CC + "&l=english&filters=" + filters);
}
const prices = {};
for (let i = 0; i < IDS.length; i += 10) {
  const chunk = IDS.slice(i, i + 10);
  let j = null;
  try { j = await details(chunk, "price_overview"); } catch (e) { console.warn(e.message); }
  for (const id of chunk) {
    const e = j && j[id];
    const p = e && e.success && e.data && e.data.price_overview;
    if (p && p.currency === "EUR") prices[id] = { p: p.final / 100, o: p.initial / 100 };
  }
  await sleep(1500);
}
const wl = await wishlist();
const neu = [];
for (const id of wl) {
  if (IDS.includes(id)) continue;
  const j = await details([id], "basic,price_overview");
  const e = j && j[id];
  if (!(e && e.success && e.data)) continue;
  const name = String(e.data.name || "");
  const m = name.match(/^Train Sim World\S* ?(\d):\s*(.*)$/);
  neu.push({ id, t: m ? m[2] : name, pre: m ? "TSW" + m[1] : "Steam" });
  const p = e.data.price_overview;
  if (p && p.currency === "EUR") prices[id] = { p: p.final / 100, o: p.initial / 100 };
  await sleep(1500);
}
writeFileSync("steam-update.json", JSON.stringify({ swa: 1, stand: new Date().toISOString().slice(0, 10), steamid: STEAMID, wunschliste: wl, preise: prices, neu }, null, 1));
console.log("Fertig: " + Object.keys(prices).length + " Preise, " + wl.length + " Wunschlistenplaetze, " + neu.length + " neue Eintraege.");
console.log("Oeffne steam-update.json, kopiere den ganzen Inhalt und fuege ihn im Analyzer unter Aktualisieren ein.");

const GENW=new Set(['route','add-on','addon','loco','emu','dmu','pack','line','main','the','and','of','train','sim','world','high','speed','livery','collection','edition','class','express','remastered','corridor','branches','network','subdivision','bahnstrecke','expert','gameplay','heritage']);
const toks=t=>t.toLowerCase().normalize('NFKD').replace(/[̀-ͯ]/g,'').split(/[^a-z0-9]+/).filter(w=>(w.length>2&&!GENW.has(w)));
const REG=[['Deutschland/Österreich/Schweiz',/Bahnstrecke|Mittenwald|Salzburg|Rosenheim|Rhein|Nürnberg|Nuremberg|Würzburg|München|Munich|Hamburg|Hannover|Dresden|Köln|Innsbruck|Garmisch|Wien|Vienna|Zürich|Zurich|Schweiz|Koblenz|Mainz|Kassel|Ingolstadt|Schnellfahrstrecke|\bICE\b|\bDB\b|ÖBB|\bBR \d{3}\b/i],
 ['Großbritannien',/London|Brighton|Fife|Scotland|Edinburgh|Manchester|Leeds|Birmingham|Great Western|West Coast|East Coast|Avanti|TransPennine|Peterborough|Doncaster|Blackpool|Preston|Liverpool|Overground|Underground|ScotRail|LNER|GWR|Class \d{2,3}\b|Crewe|Carlisle|Trent Valley/i],
 ['USA/Kanada',/Corridor|Subdivision|Norfolk Southern|CSX|Amtrak|Los Angeles|San Bernardino|Boston|Providence|New York|Long Beach|LIRR|Oakville|Canadian|Metra|SEPTA|California|Pennsylvania|Cajon|Antelope|Union Pacific|BNSF|Metro-North|Chicago|Hempstead/i]];
const region=t=>{for(const [n,re] of REG)if(re.test(t))return n;return null};
const NEEDS={4680150:{re:/West Coast Main Line: London Euston/i,txt:'Strecke London Euston – Milton Keynes'},4714930:{id:4680800,txt:'Strecke Nürnberg – Würzburg'}};
function needInfo(g){
  const n=NEEDS[g.id];
  if(n){const r=n.id?BY.get(n.id):G.find(x=>x.ty==='route'&&n.re.test(x.t));return {kind:'needs',txt:n.txt,route:r||null,ok:!!(r&&isOwned(r))}}
  for(const id in NEEDS){const n2=NEEDS[id],v=BY.get(+id);if(v&&(isOwned(v)||isWish(v))&&(n2.id?n2.id===g.id:n2.re.test(g.t)&&g.ty==='route'))return {kind:'hosts',veh:v,own:isOwned(v),ok:true}}
  return {kind:null,ok:false};
}
function affinity(g){
  const ref=G.filter(x=>x.id!==g.id&&(isOwned(x)||isWish(x))),w=x=>isOwned(x)?1:.5;
  const why=[];
  if(!ref.length)return {v:50,why:['Noch kein Besitz und keine Wunschliste bekannt: Passung ist neutral.'],known:false};
  const rg=region(g.t);let tot=0,same=0;
  ref.forEach(x=>{tot+=w(x);if(rg&&region(x.t)===rg)same+=w(x)});
  const share=rg&&tot?same/tot:0;
  const mine=new Set(toks(g.t));let shared=0;ref.forEach(x=>toks(x.t).forEach(t=>{if(mine.has(t))shared+=w(x)}));
  const nd=needInfo(g);
  const v=Math.round(100*(.55*share+.2*Math.min(1,shared/2)+.25*(nd.ok?1:0)));
  if(rg&&share>0)why.push(`Region ${rg} passt zu ${Math.round(share*100)} % deines Besitzes und deiner Wunschliste (Region aus dem Titel abgeleitet).`);

function recs(){
  const b=S.buy,mx=b.max>=60?Infinity:b.max,wd=b.wd/100,wDeal=.1+.3*wd,wAff=.25,wQ=1-wDeal-wAff;
  const pool=G.filter(g=>!isOwned(g)&&price(g)!=null&&price(g)>0&&price(g)<=mx&&(!b.ty||g.ty===b.ty)&&(b.scope==='all'||isWish(g)));
  return pool.map(g=>{
    const s=score(g),isR=rated(g),q=isR?s.s:50,a=affinity(g),d=disc(g);
    let value=wQ*q+wAff*a.v+wDeal*d;
    if(a.need&&a.need.kind==='needs'&&!a.need.ok)value-=8;
    const why=[];
    why.push(isR?`Score ${s.s} nach deinen Gewichten (Konfidenz ${Math.round(s.conf*100)} %, Schätzung).`:'Noch nicht bewertet: Der Platz beruht nur auf Passung und Angebot.');
    if(d>0)why.push(`−${d} % (${eur(price(g))} statt ${eur(orig(g))}).`);else why.push(`Aktuell kein Rabatt (${eur(price(g))}).`);
    why.push(...a.why);
    return {g,value,q:isR?s.s:null,aff:a.v,deal:d,why,conf:s.conf,rated:isR};
  }).sort((x,y)=>y.value-x.value);
}

function ghPoll(R,t0){
  const tick=async n=>{
    try{
      const r=await fetch('https://api.github.com/repos/'+R.o+'/'+R.r+'/actions/runs?event=workflow_dispatch&per_page=5',{headers:ghH(),cache:'no-store'});

          if(run.conclusion==='success'){showJob({running:false});await wait(4000);await reloadStatic()}
          else{showJob({running:false,error:'GitHub meldet: '+run.conclusion+'. Details unter Actions im Repository.'});toast('Der Abruf ist fehlgeschlagen')}

      }
    }catch(e){}

  };

}

  if(!d||d.forVer==null)return '<span class="pill">Version nicht erkannt</span>';
  if(d.orNewer||d.forVer>=7)return `<span class="pill good">für TSW ${d.forVer}${d.orNewer?' oder neuer':''}</span>`;
  return `<span class="pill warn">für TSW ${d.forVer}, TSW 7 unklar</span>`;
}

const MQ_SYN={skin:['reskins','livery'],skins:['reskins','livery'],reskin:['reskins'],lackierung:['reskins','livery'],farbschema:['reskins','livery'],sound:['sounds','sound'],ton:['sounds'],klang:['sounds'],fahrplan:['timetables','timetable'],fahrplaene:['timetables'],timetable:['timetables'],szenario:['scenario','scenarios'],szenarien:['scenario','scenarios'],lok:['locomotives','loco'],lokomotive:['locomotives','loco'],triebzug:['emu','multiple','units'],wagen:['wagons','coaches','rolling'],fahrzeug:['rolling','stock'],fahrzeuge:['rolling','stock'],deutsch:['german','germany','db','deutsche'],deutsche:['german','germany','db','deutsche'],oesterreich:['austrian','austria','obb'],osterreich:['austrian','austria','obb'],britisch:['british','uk','britain'],englisch:['british','uk'],amerikanisch:['north','american'],schweiz:['swiss','sbb'],patch:['patches'],werkzeug:['utilities'],tool:['utilities'],tools:['utilities']};
const MQ_STOP=new Set(['ich','suche','suchen','ein','eine','einen','fuer','fur','für','zu','zum','zur','mit','und','oder','der','die','das','den','mod','mods','gibt','es','was','welche','passend','passende','passt','bitte','danke','mir','meine','meiner','nach','von','im','in','auf','the','for','a','an','of','route','add','on','addon','train','sim','world','tsw']);
const MQ_WEAK=new Set(['br','class','db','ice','obb','sbb','re','ec']);
const mqWords=t=>String(t).toLowerCase().normalize('NFKD').replace(/[̀-ͯ]/g,'').split(/[^a-z0-9]+/).filter(Boolean);
function mqParse(q){
  const raw=mqWords(q||''),tokens=[],syn=[];let ver=null;const vm=String(q||'').toLowerCase().match(/tsw\s*(\d)/);if(vm)ver=+vm[1];
  for(const w of raw){if(MQ_STOP.has(w))continue;if(MQ_SYN[w])syn.push(...MQ_SYN[w]);else tokens.push(w)}
  return {tokens:[...new Set(tokens)],syn:[...new Set(syn)],ver};
}
function mqSearch(idx,q,limit){
  const P=mqParse(q);if(!idx||(!P.tokens.length&&!P.syn.length))return {total:0,results:[],query:P};
  const strong=P.tokens.filter(t=>!MQ_WEAK.has(t)),out=[];
  for(const m of idx.items){
    const sw=mqWords(m.slug),cw=mqWords(m.cats.join(' '));let sc=0,hit=0;const matched=[];
    for(const t of P.tokens){const weak=MQ_WEAK.has(t);let v=0;
      if(sw.includes(t))v=3;else if(sw.some(w=>w.startsWith(t)&&t.length>=3))v=2;else if(cw.includes(t))v=1.5;else if(t.length>=4&&m.slug.includes(t))v=1;
      if(v){sc+=weak?.5:v;if(!weak)hit++;matched.push(t)}}
    let sh=0;for(const t of P.syn)if(cw.includes(t)||sw.includes(t)){sh++;matched.push(t)}
    if(P.syn.length)sc+=sh?1.5+.5*sh:0;
    if(strong.length&&!hit)continue;
    if(!strong.length&&P.tokens.length&&!matched.length)continue;
    if(!P.tokens.length&&!sh)continue;
    if(P.syn.length&&!sh&&P.tokens.length)sc-=.5;
    if(strong.length>1&&hit===strong.length)sc+=2;
    out.push({...m,score:sc,matched});
  }
  out.sort((a,b)=>b.score-a.score||(b.lastmod>a.lastmod?1:-1));
  return {total:out.length,results:out.slice(0,limit),query:P};
}
async function staticMods(force){
  if(SRV.mi&&!force)return SRV.mi;
  const a=await fetch('data/mods-index.json?t='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.json():null).catch(()=>null);
  const b=await fetch('data/mods-detail.json?t='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.json():{}).catch(()=>({}));
  if(!a||!Array.isArray(a.items))throw new Error('Die Mod-Liste ist noch nicht vorhanden. Sie entsteht beim nächsten automatischen Lauf bei GitHub.');
  SRV.mi=a;SRV.md=b||{};return a;
}
async function staticSearch(q,limit){
  const idx=await staticMods(),r=mqSearch(idx,q,limit);
  r.results.forEach(m=>{const d=SRV.md&&SRV.md[m.url];if(d&&d.title)m.detail=d});
  return {...r,note:'',indexCount:idx.count,fetchedAt:idx.fetchedAt};
}
function modReply(q,j){
  const Q=j.query||{tokens:[],syn:[]},terms=[...Q.tokens,...Q.syn];
  if(!j.results.length)return `<p>Dazu habe ich nichts gefunden${terms.length?` (gesucht: ${esc(terms.join(', '))})`:''}.</p><p class="mu sm">Die Mod-Namen sind meist englisch. Probier weniger oder andere Wörter, zum Beispiel nur die Baureihe („BR 111“), den Ort oder die Art („reskin“, „sound“, „timetable“).</p>`;
  const items=j.results.map(m=>`<div class="card flat stack" style="padding:10px 12px"><div class="row sp" style="align-items:flex-start"><b style="min-width:0;overflow-wrap:anywhere">${esc((m.detail&&m.detail.title)||pretty(m.slug))}</b>${modCompat(m.detail)}</div>
  <div class="sm mu">${esc(m.cats.map(catName).join(' › '))}${m.lastmod?' · '+dts(m.lastmod.slice(0,10)):''}</div>
  <div class="row"><a class="btn sm" href="${esc(m.url)}" target="_blank" rel="noopener">Auf trainsimcommunity.com öffnen</a><span class="mu sm">Treffer: ${esc(m.matched.join(', '))}</span></div></div>`).join('');
  return `<p>Gesucht nach <b>${esc(terms.join(', '))}</b>. ${j.total} Treffer, die besten ${j.results.length}:</p>${items}${j.note?`<p class="mu sm">${esc(j.note)}</p>`:''}<p class="mu sm">Mods sind inoffiziell. Welche Version sie brauchen, steht auf der jeweiligen Seite. Es wird nichts heruntergeladen.</p>`;
}

async function modAsk(q){

  CHAT.push({who:'me',html:`<p>${esc(q)}</p>`});MODBUSY=true;drawChat(true);
  try{
    let j;
    if(SRV.static){j=await staticSearch(q,10)}
    else{const r=await fetch('/api/mods/search?limit=10&q='+encodeURIComponent(q),{cache:'no-store'});j=await r.json();if(!r.ok)throw new Error(j.error||('Fehler '+r.status))}

}

    case 'f':F[kk]=el.type==='checkbox'?el.checked:el.value;{const w=$('#wl');if(w)w.innerHTML=wishCards()}break;
    case 'c':C[kk]=el.value;afterKatalog();break;
    case 'own':{const u=U(id);u.owned=el.checked;save();const r=$('#cr'+id);if(r)r.classList.toggle('owned',el.checked);catCount();renderBest();renderNav();break}
    case 'asel':S.cur=+el.value;save();renderMain();break;

    case 'rat':{const u=U(id);u.rat=u.rat||{};u.rat[kk]=+el.value;save();liveAnalyse(BY.get(id));break}
    case 'scenic':U(id).scenic=+el.value;save();liveAnalyse(BY.get(id));break;
    case 'target':U(id).target=el.value===''?null:+el.value;save();liveAnalyse(BY.get(id));renderBest();break;
    case 'hours':U(id).hours=el.value===''?null:+el.value;save();liveAnalyse(BY.get(id));break;

    case 'auto':S.auto=el.checked;save();break;

}
